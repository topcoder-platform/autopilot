version: "3"
services:
  tc-or-grpc-server:
    image: tc-or-grpc-server:latest
    container_name: tc-or-grpc-server
    restart: always
    read_only: true
    ports:
      - "9099:9099"
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/ecs/tc-autopilot
        awslogs-region: us-east-1
        awslogs-stream-prefix: tc-or-grpc-server
    env_file:
      - api.env
  tc-autopilot:
    image: tc-autopilot:latest
    container_name: tc-autopilot
    read_only: true
    build:
      context: .
      dockerfile: ECSDockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      - grpc_client_or_address=localhost
      - grpc_client_or_port=9099
    depends_on:
      - tc-or-grpc-server
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/ecs/tc-autopilot
        awslogs-region: us-east-1
        awslogs-stream-prefix: tc-autopilot
